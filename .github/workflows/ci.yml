# CI gates: install -> typecheck -> build -> fast deterministic tests.
#
# Node version is pinned in .nvmrc (22 LTS) and consumed via
# `node-version-file` below. The repo previously had no version pin; 22 was
# derived from the dependency ranges already in package.json
# (vite ^6 requires Node ^18 || ^20 || >=22; typescript ~5.7 is happy on 22).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (high)
        run: npm audit --audit-level=high

      # HARD GATE (passes clean on main: 0 errors). tsconfig already sets
      # noEmit and typescript is already a devDependency, so no extra flags
      # or installs are needed. `vite build` never typechecks, which is why
      # this explicit step exists.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Fastest deterministic test suite (~0.5s locally): behavior-tree
      # substrate tests. Explicitly free of Math.random / Date.now.
      - name: Test (behavior-tree)
        run: npm run test:bt

      - name: Test (import)
        run: npm run test:import

      # Fast pinned-sim subset (determinism, brain, pinned-codes):
      # baseline-diff verdict vs .github/ci-expected-soak-fast.txt.
      - name: Test (sim fast pins)
        run: npm run test:sim:fast

      # Fast static checks over procedural pixel art (~0.1s, plain node).
      - name: Art QA
        run: npm run art:qa

      # Manifest verifier (baseline-diff): re-sims showcase/leaderboard
      # replay codes, green iff the `  MISMATCH ` line set is unchanged
      # vs .github/nightly-expected-manifests.txt (11 baselined
      # re-simmed-loss vs claimed-win mismatches on main). The raw
      # verify exit code is ignored (|| true); the diff is the verdict.
      - name: Verify manifests (baseline-diff)
        run: |
          set -o pipefail; npm run verify:manifests 2>&1 | tee ci-manifests.log || true
          grep -E '^  MISMATCH ' ci-manifests.log | LC_ALL=C sort > ci-manifests-actual.txt || true
          grep -E '^  MISMATCH ' .github/nightly-expected-manifests.txt | LC_ALL=C sort > ci-manifests-expected.txt || true
          if diff -u ci-manifests-expected.txt ci-manifests-actual.txt; then
            echo "baseline unchanged: verify:manifests mismatches match .github/nightly-expected-manifests.txt"
          else
            echo "baseline changed: verify:manifests mismatches differ from .github/nightly-expected-manifests.txt"
            echo "In the diff above, '-' lines are expected-only (disappeared or changed) and '+' lines are actual-only (new or changed)."
            echo "If this change is intentional, update .github/nightly-expected-manifests.txt in the same PR and explain it there."
            exit 1
          fi

      # EXCLUDED: `npm run test:sim` (tools/soak.ts, full soak) is a long
      # soak, not a PR gate. It runs pairwise bot-vs-bot matches across
      # every bot x seed x arena (~32s locally and growing with the
      # roster) and currently has 4 pre-existing failures on main (1v1
      # regression vs pre-brain hunter, featured-code re-sims, RA1/RA2
      # pinned codes). Run the full soak locally/nightly, not per-PR.
      # The fast pinned subset above (`npm run test:sim:fast`) does gate
      # PRs: it runs only determinism, brain, and pinned-codes and is
      # green iff its failure lines are unchanged vs
      # .github/ci-expected-soak-fast.txt. The full soak (incl. the
      # manifests/featured-code re-sims) stays Nightly-only.
      #
      # EXCLUDED: `npm run eval:*` (smoke/rr/ladder/full) are long-running
      # balance/evolution harnesses (rr defaults to 50 seeds per pairing,
      # full to 200) that also write to eval/out-*. Keep them manual/nightly.
      #
      # `npm run verify:manifests` IS a PR gate via the baseline-diff step
      # above (green iff its `  MISMATCH ` lines are unchanged vs
      # .github/nightly-expected-manifests.txt). It currently has 11
      # pre-existing showcase-code mismatches on main (re-simmed loss vs
      # claimed win in public/data/showcase.json); the gate stays green
      # until that set changes. Showcase regeneration (`emit:showcase`,
      # separate PR) will update the baseline when the drift is fixed.
