# Nightly known-failure baseline check (not a PR gate).
#
# test:sim (4 pre-existing failures) and verify:manifests (11 pre-existing
# showcase mismatches) are excluded from PR CI (see ci.yml), so this workflow
# is the only place they run. The soak/manifests jobs below only record logs
# (their test steps use continue-on-error so the known failures do not fail
# those jobs); the baseline-check job is the workflow's pass/fail.
#
# Nightly is green iff tonight's failure set exactly matches
# tools/nightly-baseline.json as multisets (order ignored, duplicates count):
# a NEW failure, a heal+new swap, OR a healed known failure all turn it red
# via tools/nightly-baseline-check.mjs. To update the baseline deliberately:
# run `npm run test:sim` and `npm run verify:manifests` on a verified-good
# main, capture the FAIL names (detail after ' -- ' stripped) and MISMATCH
# messages (text after 'MISMATCH '), replace the arrays in
# tools/nightly-baseline.json, keep tools/fixtures/nightly-baseline/ in sync,
# run `node tools/nightly-baseline-check.mjs --self-test`, and review the
# diff like code.

name: Nightly

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  soak:
    name: Sim soak (test:sim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sim soak (test:sim)
        continue-on-error: true
        run: set -o pipefail; npm run test:sim 2>&1 | tee nightly-soak.log

      - name: Upload soak log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-soak-log
          path: nightly-soak.log

  manifests:
    name: Verify manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify manifests
        continue-on-error: true
        run: set -o pipefail; npm run verify:manifests 2>&1 | tee nightly-manifests.log

      - name: Upload manifests log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-manifests-log
          path: nightly-manifests.log

  baseline-check:
    name: Baseline check
    needs: [soak, manifests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download soak log
        uses: actions/download-artifact@v4
        with:
          name: nightly-soak-log

      - name: Download manifests log
        uses: actions/download-artifact@v4
        with:
          name: nightly-manifests-log

      - name: Compare against known-failure baseline
        run: node tools/nightly-baseline-check.mjs --soak nightly-soak.log --manifests nightly-manifests.log
